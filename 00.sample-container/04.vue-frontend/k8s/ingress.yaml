apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
#  annotations:
#    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: sk244-cert-ingress
  namespace: class-8
  labels:
    app: sk244-cert-ingress
spec:
  ingressClassName: public-nginx
  rules:
    - host: sk244-ingress.class-8.skala-ai.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sk244-myfirst-api-server
                port:
                  number: 8080
          - path: /python
            pathType: Prefix
            backend:
              service:
                name: sk244-myfirst-api-server
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: sk244-myfirst-api-server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sk244-frontend
                port:
                  number: 8080
  tls:
  - hosts:
    - 'sk244-cert-ingress.class-8.skala-ai.com'
    secretName: wildcard-class-8-skala-ai-com-tls
